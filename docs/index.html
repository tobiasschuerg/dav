<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAV Touren Finder – Friedrichshafen, Ravensburg, Überlingen & Lindau</title>
<meta name="description" content="Aktuelle Touren, Kurse und Veranstaltungen der DAV-Sektionen Friedrichshafen, Ravensburg, Überlingen und Lindau an einem Ort, automatisch aktualisiert.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #e9eef0;
    --surface: #ffffff;
    --surface-sunken: #dfe7ea;
    --ink: #1a2226;
    --ink-muted: #4c5f68;
    --ink-faint: #7c8d94;
    --border: #ccd8dc;
    --border-strong: #a3c2d3;

    --accent: #3e7292;
    --accent-soft: #dce9f0;
    --accent-strong: #2d5873;

    --accent-2: #4e7d5b;
    --accent-2-soft: #dceae0;
    --accent-2-strong: #3a6147;

    --fn: #4e7d5b;
    --fn-soft: #dceae0;
    --rv: #3e7292;
    --rv-soft: #dce9f0;
    --ue: #33454f;
    --ue-soft: #ccd8dc;
    --li: #6b5b8a;
    --li-soft: #e3ddf0;

    --good: #3e7d54;
    --good-soft: #d9ecdf;
    --warn: #a8721f;
    --warn-soft: #f2e6cd;
    --crit: #b3402e;
    --crit-soft: #f2ddd6;
    --crit-ink: #ffffff;

    --font-heading: "Caprasimo", Georgia, serif;
    --font-body: "Figtree", system-ui, sans-serif;
    --radius-lg: 28px;

    --shadow-sm: 0 1px 2px rgba(26, 34, 38, 0.08), 0 6px 16px -10px rgba(26, 34, 38, 0.16);
    --shadow-md: 0 3px 10px rgba(26, 34, 38, 0.12), 0 10px 26px -12px rgba(26, 34, 38, 0.22);

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161a;
      --surface: #182129;
      --surface-sunken: #1e2830;
      --ink: #e7edf0;
      --ink-muted: #aebcc3;
      --ink-faint: #7f929b;
      --border: #2a3841;
      --border-strong: #3f6a86;

      --accent: #7fb4d6;
      --accent-soft: #1c3646;
      --accent-strong: #bcdcf0;

      --accent-2: #8fc19f;
      --accent-2-soft: #1e3327;
      --accent-2-strong: #c3e5cc;

      --fn: #8fc19f;
      --fn-soft: #1e3327;
      --rv: #7fb4d6;
      --rv-soft: #1c3646;
      --ue: #aebcc3;
      --ue-soft: #263139;
      --li: #b8a8d9;
      --li-soft: #2c2640;

      --good: #6fbf8a;
      --good-soft: #1c3324;
      --warn: #d9a552;
      --warn-soft: #33291a;
      --crit: #d9836f;
      --crit-soft: #33221d;
      --crit-ink: #1a1210;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px -10px rgba(0, 0, 0, 0.45);
      --shadow-md: 0 3px 10px rgba(0, 0, 0, 0.35), 0 10px 26px -12px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #11161a;
    --surface: #182129;
    --surface-sunken: #1e2830;
    --ink: #e7edf0;
    --ink-muted: #aebcc3;
    --ink-faint: #7f929b;
    --border: #2a3841;
    --border-strong: #3f6a86;

    --accent: #7fb4d6;
    --accent-soft: #1c3646;
    --accent-strong: #bcdcf0;

    --accent-2: #8fc19f;
    --accent-2-soft: #1e3327;
    --accent-2-strong: #c3e5cc;

    --fn: #8fc19f;
    --fn-soft: #1e3327;
    --rv: #7fb4d6;
    --rv-soft: #1c3646;
    --ue: #aebcc3;
    --ue-soft: #263139;

    --good: #6fbf8a;
    --good-soft: #1c3324;
    --warn: #d9a552;
    --warn-soft: #33291a;
    --crit: #d9836f;
    --crit-soft: #33221d;
    --crit-ink: #1a1210;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px -10px rgba(0, 0, 0, 0.45);
    --shadow-md: 0 3px 10px rgba(0, 0, 0, 0.35), 0 10px 26px -12px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent-strong); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }

  /* — month rail — */
  .rail-nav {
    position: fixed;
    right: 1.1rem;
    top: 50%;
    transform: translateY(-50%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    align-items: stretch;
  }

  @media (max-width: 700px) {
    .rail-nav { display: none; }
  }

  .rail-sep {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.65rem 0.15rem;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  .rail-sep::after {
    content: "";
    flex: 1;
    height: 1.5px;
    background: var(--border);
    border-radius: 1px;
    min-width: 14px;
  }

  .rail-btn {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 0.28rem 0.65rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    text-align: left;
    background: transparent;
    color: var(--ink-muted);
  }

  .rail-btn .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .rail-btn[aria-current="true"] {
    background: var(--surface);
    color: var(--accent-strong);
    box-shadow: var(--shadow-sm);
  }

  .rail-btn[aria-current="true"] .dot { background: var(--accent); }

  /* — header — */
  header.top { margin-bottom: 2.5rem; }

  h1 {
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 3.6rem);
    line-height: 1.05;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .sub {
    color: var(--ink-muted);
    font-size: 1.05rem;
    max-width: 54ch;
    margin: 0.9rem 0 0;
    line-height: 1.55;
    text-wrap: pretty;
  }

  /* — controls — */
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    padding: 0.9rem 0;
    background: linear-gradient(var(--bg) 82%, transparent);
  }

  .segmented {
    display: inline-flex;
    background: var(--surface-sunken);
    border-radius: 999px;
    padding: 0.25rem;
    gap: 0.15rem;
  }

  .segmented button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 0.45rem 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  .segmented button .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  .segmented button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .segmented button[data-key="fn"][aria-pressed="true"] { color: var(--fn); }
  .segmented button[data-key="rv"][aria-pressed="true"] { color: var(--rv); }
  .segmented button[data-key="ue"][aria-pressed="true"] { color: var(--ue); }
  .segmented button[data-key="li"][aria-pressed="true"] { color: var(--li); }
  .segmented button[data-key="fn"] .dot { background: var(--fn); }
  .segmented button[data-key="rv"] .dot { background: var(--rv); }
  .segmented button[data-key="ue"] .dot { background: var(--ue); }
  .segmented button[data-key="li"] .dot { background: var(--li); }

  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.2rem 0 0.8rem;
  }

  .chip {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    cursor: pointer;
  }

  .chip:hover { border-color: var(--border-strong); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chip[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .search {
    flex: 1;
    min-width: 190px;
    position: relative;
  }

  .search svg {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
  }

  .search input {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 0.55rem 1rem 0.55rem 2.3rem;
  }

  .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .count-line {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin: 0.3rem 0 0.5rem;
  }

  .empty {
    text-align: center;
    color: var(--ink-muted);
    padding: 3.5rem 1rem;
    font-size: 0.95rem;
  }

  /* — month groups — */
  .month-head {
    display: flex;
    align-items: baseline;
    gap: 0.7rem;
    margin: 2.4rem 0 0.9rem;
  }

  .month-head h2 {
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: 1.5rem;
    margin: 0;
    color: var(--ink);
  }

  .month-head .count {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  /* — tour card — */
  .tour {
    display: grid;
    grid-template-columns: 3.4rem 1fr;
    gap: 1rem;
    align-items: start;
    background: var(--surface);
    border-radius: var(--radius-lg, 16px);
    padding: 1rem 1.15rem;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
  }

  .tour:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .tour:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tour.sold-out { opacity: 0.65; }

  .tour .daybox {
    width: 3.4rem;
    height: 3.4rem;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
  }

  .tour .daybox .dow {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .tour .daybox .dom {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .tour .body { min-width: 0; }

  .badge-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    margin-bottom: 0.25rem;
  }

  .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .tag {
    font-size: 0.74rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
  }

  .tag-cat { color: var(--ink-muted); background: var(--surface-sunken); }
  .tag-group { color: var(--ink-muted); background: transparent; border: 1px solid var(--border); }
  .tag-diff { color: var(--accent-strong); background: var(--accent-soft); }
  .tag-days { color: var(--accent-2-strong); background: var(--accent-2-soft); }
  .tag-good { color: var(--good); background: var(--good-soft); }
  .tag-warn { color: var(--warn); background: var(--warn-soft); }
  .tag-neutral { color: var(--ink-muted); background: var(--surface-sunken); }

  .tag-soldout {
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--crit-ink);
    background: var(--crit);
  }

  .tour .title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
    text-wrap: pretty;
  }

  .tour .meta-line {
    margin-top: 0.25rem;
    font-size: 0.8rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .tour .desc {
    margin-top: 0.3rem;
    font-size: 0.85rem;
    color: var(--ink-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  @media (max-width: 480px) {
    .tour { grid-template-columns: 2.6rem 1fr; padding: 0.85rem 1rem; }
    .tour .daybox { width: 2.6rem; height: 2.6rem; }
    .segmented { gap: 0.1rem; }
    .segmented button { padding: 0.4rem 0.6rem; font-size: 0.8rem; gap: 0.3rem; }
  }
</style>
</head>
<body>
<div class="page">
  <nav class="rail-nav" id="railNav" aria-label="Zeitleiste"></nav>

  <header class="top">
    <h1>DAV Touren Finder</h1>
    <p class="sub">Touren, Kurse und Veranstaltungen der DAV-Sektionen Friedrichshafen, Ravensburg, Überlingen und Lindau.</p>
  </header>

  <div class="controls">
    <div class="segmented" id="segmented" role="group" aria-label="Sektion filtern">
      <button type="button" data-key="all" aria-pressed="true">Alle</button>
      <button type="button" data-key="fn" aria-pressed="false"><span class="dot"></span>Friedrichshafen</button>
      <button type="button" data-key="rv" aria-pressed="false"><span class="dot"></span>Ravensburg</button>
      <button type="button" data-key="ue" aria-pressed="false"><span class="dot"></span>Überlingen</button>
      <button type="button" data-key="li" aria-pressed="false"><span class="dot"></span>Lindau</button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Tour suchen …" aria-label="Touren durchsuchen">
    </div>
  </div>

  <div class="category-chips" id="categoryChips" role="group" aria-label="Tourarten filtern"></div>

  <p class="count-line" id="countLine"></p>

  <div id="results"></div>
</div>

<script>
  let TOURS = [];
  let loaded = false;

  const dowFmt = new Intl.DateTimeFormat("de-DE", { weekday: "short" });
  const monthFmt = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" });
  const shortMonthFmt = new Intl.DateTimeFormat("de-DE", { month: "short" });

  function parseDate(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function fmtDM(iso) {
    const d = parseDate(iso);
    return d ? d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) : "";
  }

  const SECTION_INFO = {
    fn: { label: "Friedrichshafen", match: "Friedrichshafen" },
    rv: { label: "Ravensburg", match: "Ravensburg" },
    ue: { label: "Überlingen", match: "Überlingen" },
    li: { label: "Lindau", match: "Lindau" },
  };

  function sectionKey(section) {
    for (const [key, info] of Object.entries(SECTION_INFO)) {
      if (section.includes(info.match)) return key;
    }
    return "rv";
  }

  function categoriesOf(tour) {
    return (tour.category || "").split(/[/,]/).map(c => c.trim()).filter(Boolean);
  }

  const TODAY_ISO = new Date().toISOString().slice(0, 10);
  const SOON_ISO = (() => { const d = new Date(); d.setDate(d.getDate() + 7); return d.toISOString().slice(0, 10); })();

  function daysSpan(t) {
    if (!t.date || !t.end_date || t.end_date <= t.date) return 0;
    const start = parseDate(t.date);
    const end = parseDate(t.end_date);
    return Math.round((end - start) / 86400000) + 1;
  }

  function statusClass(status) {
    if (!status) return null;
    if (status.includes("ausgebucht")) return "crit";
    if (status.includes("noch ein paar")) return "warn";
    if (status.includes("Genug")) return "good";
    return null;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function buildCategoryChips() {
    const counts = new Map();
    for (const t of TOURS) {
      for (const cat of categoriesOf(t)) {
        counts.set(cat, (counts.get(cat) || 0) + 1);
      }
    }
    categoryCounts = [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0], "de"));
    renderCategoryChips();
  }

  function renderCategoryChips() {
    const container = document.getElementById("categoryChips");
    container.innerHTML = categoryCounts.map(([cat, count]) => `
      <button type="button" class="chip" data-cat="${escapeHtml(cat)}" aria-pressed="${activeCategories.has(cat)}">${escapeHtml(cat)} · ${count}</button>
    `).join("");
  }

  let activeSection = "all";
  let activeCategories = new Set();
  let categoryCounts = [];
  let query = "";
  let activeMonth = 0;
  let groupCount = 0;

  function render() {
    const filtered = TOURS.filter(t => {
      if (activeSection !== "all" && sectionKey(t.section) !== activeSection) return false;
      if (activeCategories.size && !categoriesOf(t).some(c => activeCategories.has(c))) return false;
      if (query && !t.title.toLowerCase().includes(query)) return false;
      return true;
    });

    document.getElementById("countLine").textContent = loaded
      ? `${filtered.length} von ${TOURS.length} Touren`
      : "Lade Touren …";

    const results = document.getElementById("results");

    if (filtered.length === 0) {
      results.innerHTML = loaded ? `<div class="empty">Keine Touren gefunden.</div>` : "";
      document.getElementById("railNav").innerHTML = "";
      groupCount = 0;
      return;
    }

    const groups = [];
    const byKey = new Map();
    for (const t of filtered) {
      const d = parseDate(t.date);
      const key = d ? `${d.getFullYear()}-${d.getMonth()}` : "ohne-datum";
      if (!byKey.has(key)) {
        const g = { idx: groups.length, date: d, label: d ? monthFmt.format(d) : "Ohne Datum", short: d ? shortMonthFmt.format(d) : "–", year: d ? String(d.getFullYear()) : "", items: [] };
        byKey.set(key, g);
        groups.push(g);
      }
      byKey.get(key).items.push(t);
    }
    groupCount = groups.length;

    let html = "";
    for (const g of groups) {
      html += `<div id="month-${g.idx}"><div class="month-head"><h2>${g.label}</h2><span class="count">${g.items.length} Touren</span></div><div class="list">`;
      for (const t of g.items) {
        const key = sectionKey(t.section);
        const d = parseDate(t.date);
        const dow = d ? dowFmt.format(d) : "";
        const dom = d ? d.getDate() : "–";
        const sClass = statusClass(t.status);
        const soldOut = sClass === "crit";
        const days = daysSpan(t);

        let deadlineTag = "";
        if (t.registration_deadline && !soldOut) {
          if (t.registration_deadline < TODAY_ISO) {
            deadlineTag = `<span class="tag tag-neutral">Anmeldung abgelaufen</span>`;
          } else if (t.registration_deadline <= SOON_ISO) {
            deadlineTag = `<span class="tag tag-warn">Anmeldung bis ${fmtDM(t.registration_deadline)}</span>`;
          }
        }

        const metaBits = [];
        if (t.time) metaBits.push(escapeHtml(t.time));
        if (days) metaBits.push(`bis ${fmtDM(t.end_date)}`);
        const metaLine = metaBits.length ? `<div class="meta-line">${metaBits.join(" · ")}</div>` : "";

        const statusTag = sClass && !soldOut ? `<span class="tag tag-${sClass}">${escapeHtml(t.status)}</span>` : "";

        html += `
          <a class="tour${soldOut ? " sold-out" : ""}" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">
            <div class="daybox" style="background: var(--${key}-soft); color: var(--${key})"><div class="dow">${dow}</div><div class="dom">${dom}</div></div>
            <div class="body">
              <div class="badge-row">
                <span class="section-label" style="color: var(--${key})">${SECTION_INFO[key].label}</span>
                ${t.category ? `<span class="tag tag-cat">${escapeHtml(t.category)}</span>` : ""}
                ${t.group ? `<span class="tag tag-group">${escapeHtml(t.group)}</span>` : ""}
                ${t.difficulty ? `<span class="tag tag-diff">${escapeHtml(t.difficulty)}</span>` : ""}
                ${days ? `<span class="tag tag-days">${days} Tage</span>` : ""}
                ${soldOut ? `<span class="tag tag-soldout">Ausgebucht</span>` : ""}
                ${statusTag}
                ${deadlineTag}
              </div>
              <div class="title">${escapeHtml(t.title)}</div>
              ${metaLine}
              ${t.description ? `<div class="desc">${escapeHtml(t.description)}</div>` : ""}
            </div>
          </a>`;
      }
      html += `</div>`;
    }
    results.innerHTML = html;

    buildRail(groups);
  }

  function buildRail(groups) {
    const nav = document.getElementById("railNav");
    if (groups.length <= 1) {
      nav.innerHTML = "";
      return;
    }
    let html = "";
    let lastYear = null;
    for (const g of groups) {
      if (g.year && g.year !== lastYear) {
        html += `<div class="rail-sep">${g.year}</div>`;
        lastYear = g.year;
      }
      html += `<button type="button" class="rail-btn" data-idx="${g.idx}" aria-current="${g.idx === activeMonth}"><span class="dot"></span>${g.short}</button>`;
    }
    nav.innerHTML = html;
  }

  function updateActiveMonth() {
    let active = 0;
    for (let i = 0; i < groupCount; i++) {
      const el = document.getElementById("month-" + i);
      if (!el) break;
      if (el.getBoundingClientRect().top <= 140) active = i;
    }
    if (active === activeMonth) return;
    activeMonth = active;
    for (const btn of document.querySelectorAll(".rail-btn")) {
      btn.setAttribute("aria-current", String(Number(btn.dataset.idx) === activeMonth));
    }
  }

  document.getElementById("segmented").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    activeSection = btn.dataset.key;
    [...document.querySelectorAll("#segmented button")].forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });

  document.getElementById("categoryChips").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    const cat = btn.dataset.cat;
    if (activeCategories.has(cat)) activeCategories.delete(cat);
    else activeCategories.add(cat);
    renderCategoryChips();
    render();
  });

  document.getElementById("searchInput").addEventListener("input", e => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById("railNav").addEventListener("click", e => {
    const btn = e.target.closest(".rail-btn");
    if (!btn) return;
    const el = document.getElementById("month-" + btn.dataset.idx);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 110, behavior: "smooth" });
  });

  window.addEventListener("scroll", updateActiveMonth, { passive: true });

  render();

  fetch("tours.json")
    .then(r => r.json())
    .then(data => {
      TOURS = data.tours;
      loaded = true;
      buildCategoryChips();
      render();
    });
</script>
</body>
</html>
